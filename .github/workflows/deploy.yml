name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Frontend deploys are handled by Vercel's own GitHub integration — connect
  # the repo in the Vercel dashboard and it deploys automatically on push.
  # This job only handles what Firebase itself owns: Firestore security rules.
  deploy-firestore-rules:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 || vars.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 secret/variable."
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing FIREBASE_PROJECT_ID (or NEXT_PUBLIC_FIREBASE_PROJECT_ID) secret/variable."
            exit 1
          fi
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > /tmp/gcp-sa.json
          if [ ! -s /tmp/gcp-sa.json ]; then
            echo "::error::Decoded service account key is empty or invalid base64."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> $GITHUB_ENV

      - name: Deploy Firestore rules
        run: |
          npx firebase-tools deploy \
            --only firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

  # Optional — only needed if this project actually uses backend/ (the Express
  # API). Cloud Functions v2 requires the Blaze (pay-as-you-go) plan, so this
  # never runs automatically — trigger it manually via "Run workflow" in the
  # Actions tab once the Firebase project is on Blaze and you're ready to ship
  # the backend.
  deploy-functions:
    name: Deploy Backend (optional, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      - name: Authenticate to Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 || vars.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 secret/variable."
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing FIREBASE_PROJECT_ID (or NEXT_PUBLIC_FIREBASE_PROJECT_ID) secret/variable."
            exit 1
          fi
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > /tmp/gcp-sa.json
          if [ ! -s /tmp/gcp-sa.json ]; then
            echo "::error::Decoded service account key is empty or invalid base64."
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> $GITHUB_ENV

      - name: Deploy Cloud Function
        run: |
          npx firebase-tools deploy \
            --only functions \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
